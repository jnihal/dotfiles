# ==========================
# Default Terminal
# ==========================
set -g default-terminal "screen-256color"

# ==========================
# Pane Divider
# ==========================
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=brightblack

# Dim inactive panes
set-window-option -g window-style fg=white,bg=colour236
set-window-option -g window-active-style fg=white,bg=colour235

# ==========================
# Command / Message Line
# ==========================
set-window-option -g message-style fg=black,bold,bg=colour11

# ==========================
# Status Bar
# ==========================
set-option -g status-style fg=white,bold,bg=brightblack

# Left side: show session, window, and pane info
set-option -g status-left-length 50
set-option -g status-left "[#[fg=white]S: #S, #[fg=colour11]W #I-#W, #[fg=colour3]P: #P #[fg=white]]"

# Right side: show pane sync, prefix, copy mode
set-option -g status-right '#{?pane_synchronized, #[fg=black]#[bg=green] SYNC #[default],}'
set-option -ag status-right '#{?client_prefix, #[fg=black]#[bg=green] PREFIX #[default],}'
set-option -ag status-right '#{?pane_in_mode, #[fg=black]#[bg=green] COPY #[default],}'

# ==========================
# Mouse and Index Settings
# ==========================
set -g mouse on
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
# Prefix Key
# ==========================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==========================
# Window Navigation
# ==========================
bind -n S-Left  previous-window
bind -n S-Right next-window

# ==========================
# TPM Plugins
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'

# ==========================
# Keybindings
# ==========================
# Copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Toggle synchronize-panes
bind s setw synchronize-panes

# Clear screen
unbind C-l
bind -n C-l send-keys C-l

# Reload config
# bind-key C-r source-file ~/.tmux.conf \; display "Config Reloaded"

# ==========================
# Continuum Settings
# ==========================
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm,fullscreen'
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# ==========================
# Display & History
# ==========================
set-option -g display-time 2000           # status messages duration
set-option -g display-panes-time 2000     # pane number duration
set-option -g history-limit 50000         # increase scrollback buffer
set-option -g lock-after-time 3600        # lock session after inactivity
set-option -wg automatic-rename off       # disable automatic window rename

# ==========================
# Pane & Session Management
# ==========================
unbind-key x
bind-key x kill-pane
bind-key X kill-session

# Split windows with current directory
bind-key | split-window -h -c "#{pane_current_path}"
bind-key _ split-window -v -c "#{pane_current_path}"
